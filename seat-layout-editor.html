<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수덕전 좌석 배치도 만들기</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f5f5f3;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
  header{padding:12px 16px;background:#fff;border-bottom:2px solid #222;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  header h1{margin:0 12px 0 0;font-size:17px}
  button,input{font:inherit}
  button{min-height:36px;padding:2px 12px;border:1.5px solid #222;background:#fff;border-radius:6px;cursor:pointer}
  button:hover{background:#eee}
  button.main{background:#222;color:#fff}
  label{font-size:13px;color:#444}
  input[type=number]{width:70px;min-height:34px;border:1.5px solid #bbb;border-radius:6px;padding:2px 6px}
  .bar{padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border-bottom:1px solid #ccc}
  .sep{width:1px;height:24px;background:#ccc}
  #info{font-size:13px;color:#444;margin-left:auto}
  main{padding:12px 16px}
  svg{width:100%;height:auto;background:#fff;border:2px solid #222;display:block;touch-action:none}
  .sel .shape{stroke:#0369a1;stroke-width:3}
  g.it{cursor:move}
  .help{font-size:12px;color:#555;margin:8px 0 0}
</style>
</head>
<body>
<header><h1>수덕전 좌석 배치도 만들기</h1>
  <button type="button" class="main" id="addT">테이블 추가</button>
  <button type="button" class="main" id="addC">의자 추가</button>
</header>
<div class="bar">
  <button type="button" id="rot">회전 (R)</button>
  <button type="button" id="dup">복제 (D)</button>
  <button type="button" id="del">삭제 (Delete)</button>
  <span class="sep"></span>
  <label>가로 <input type="number" id="tw" min="20" max="400" step="10"></label>
  <label>세로 <input type="number" id="th" min="20" max="400" step="10"></label>
  <span style="font-size:12px;color:#555">선택한 테이블 크기</span>
  <span id="info"></span>
</div>
<div class="bar">
  <label>바닥 가로 <input type="number" id="fw" min="300" step="50"></label>
  <label>세로 <input type="number" id="fh" min="300" step="50"></label>
  <span class="sep"></span>
  <label>참고 사진 <input type="file" id="bg" accept="image/*"></label>
  <label>투명도 <input type="range" id="op" min="0" max="100" value="40"></label>
  <span class="sep"></span>
  <button type="button" id="json">JSON 저장</button>
  <button type="button" id="png">PNG 저장</button>
  <button type="button" id="clear">모두 지우기</button>
</div>
<main>
  <svg id="svg" role="img" aria-label="좌석 배치도 작업 영역"></svg>
  <p class="help">추가한 테이블과 의자를 끌어서 옮깁니다. 칸 간격은 10입니다. 자동 저장되며, 참고 사진은 저장되지 않습니다.</p>
</main>
<script>
const NS="http://www.w3.org/2000/svg", KEY="sudeok-seat-simple-v1";
let S={fw:1000,fh:600,items:[]}, sel=null, drag=null, bgUrl=null, bgOp=.4;
const svg=document.getElementById("svg");
try{const o=JSON.parse(localStorage.getItem(KEY)||"null"); if(o&&o.items) S=o;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cur=()=>S.items.find(i=>i.id===sel)||null;
const dims=i=>i.kind==="table"?[i.w,i.h]:[26,26];
const snap=v=>Math.round(v/10)*10;

function add(kind){
  const it=kind==="table"?{kind,w:80,h:60,x:0,y:0,rot:0}:{kind,x:0,y:0,rot:0};
  it.id="i"+Date.now()+Math.floor(Math.random()*999);
  it.x=snap(S.fw/2-20); it.y=snap(S.fh/2-20);
  S.items.push(it); sel=it.id; save(); render();
}
function mk(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e;}

function render(){
  svg.setAttribute("viewBox","0 0 "+S.fw+" "+S.fh); svg.innerHTML="";
  if(bgUrl) svg.appendChild(mk("image",{href:bgUrl,x:0,y:0,width:S.fw,height:S.fh,opacity:bgOp,preserveAspectRatio:"xMidYMid meet"}));
  let d=""; for(let x=0;x<=S.fw;x+=50)d+="M"+x+" 0V"+S.fh; for(let y=0;y<=S.fh;y+=50)d+="M0 "+y+"H"+S.fw;
  svg.appendChild(mk("path",{d,stroke:"#e6e6e0","stroke-width":1}));
  S.items.forEach(it=>{
    const [w,h]=dims(it);
    const g=mk("g",{class:"it"+(it.id===sel?" sel":""),transform:"translate("+(it.x+w/2)+" "+(it.y+h/2)+") rotate("+it.rot+")"});
    g.appendChild(it.kind==="table"
      ? mk("rect",{class:"shape",x:-w/2,y:-h/2,width:w,height:h,rx:4,fill:"#fff",stroke:"#222","stroke-width":2})
      : mk("circle",{class:"shape",r:13,fill:"#9a9a92",stroke:"#222","stroke-width":2}));
    g.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();sel=it.id;const p=pt(e);drag={id:it.id,dx:p.x-it.x,dy:p.y-it.y};svg.setPointerCapture(e.pointerId);render();});
    svg.appendChild(g);
  });
  const t=S.items.filter(i=>i.kind==="table").length, c=S.items.length-t;
  document.getElementById("info").textContent="테이블 "+t+"개, 의자 "+c+"개";
  const it=cur(), isT=it&&it.kind==="table";
  document.getElementById("tw").disabled=document.getElementById("th").disabled=!isT;
  document.getElementById("tw").value=isT?it.w:""; document.getElementById("th").value=isT?it.h:"";
}
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
svg.addEventListener("pointermove",e=>{if(!drag)return;const it=S.items.find(i=>i.id===drag.id);if(!it)return;const p=pt(e);
  it.x=Math.max(0,Math.min(S.fw-20,snap(p.x-drag.dx)));it.y=Math.max(0,Math.min(S.fh-20,snap(p.y-drag.dy)));render();});
svg.addEventListener("pointerup",()=>{if(drag){drag=null;save();}});
svg.addEventListener("pointerdown",e=>{if(e.target===svg||e.target.tagName==="path"||e.target.tagName==="image"){sel=null;render();}});

const $=id=>document.getElementById(id);
$("addT").onclick=()=>add("table"); $("addC").onclick=()=>add("chair");
$("rot").onclick=()=>{const i=cur();if(i){i.rot=(i.rot+90)%360;save();render();}};
$("del").onclick=()=>{if(sel){S.items=S.items.filter(i=>i.id!==sel);sel=null;save();render();}};
$("dup").onclick=()=>{const i=cur();if(!i)return;const c={...i,id:"i"+Date.now(),x:i.x+20,y:i.y+20};S.items.push(c);sel=c.id;save();render();};
$("tw").onchange=()=>{const i=cur();if(i&&i.kind==="table"){i.w=Math.max(20,+$("tw").value||80);save();render();}};
$("th").onchange=()=>{const i=cur();if(i&&i.kind==="table"){i.h=Math.max(20,+$("th").value||60);save();render();}};
$("fw").value=S.fw;$("fh").value=S.fh;
$("fw").onchange=()=>{S.fw=Math.max(300,+$("fw").value||1000);save();render();};
$("fh").onchange=()=>{S.fh=Math.max(300,+$("fh").value||600);save();render();};
$("bg").onchange=e=>{const f=e.target.files[0];if(!f)return;if(bgUrl)URL.revokeObjectURL(bgUrl);bgUrl=URL.createObjectURL(f);render();};
$("op").oninput=e=>{bgOp=e.target.value/100;render();};
$("clear").onclick=()=>{if(confirm("배치한 항목을 모두 지울까요?")){S.items=[];sel=null;save();render();}};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(e.key==="Delete"||e.key==="Backspace")$("del").click(); if(e.key==="r"||e.key==="R")$("rot").click(); if(e.key==="d"||e.key==="D")$("dup").click();});
function dl(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}
$("json").onclick=()=>{const t=S.items.filter(i=>i.kind==="table"),c=S.items.filter(i=>i.kind==="chair");
  dl("seat-layout.json",new Blob([JSON.stringify({floor:{width:S.fw,height:S.fh},tableCount:t.length,chairCount:c.length,tables:t,chairs:c},null,2)],{type:"application/json"}));};
$("png").onclick=()=>{sel=null;render();const x=new XMLSerializer().serializeToString(svg).replace("<svg ","<svg xmlns='"+NS+"' ");
  const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=S.fw;c.height=S.fh;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>dl("seat-layout.png",b));};
  im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(x);};
render();
</script>
</body>
</html>
