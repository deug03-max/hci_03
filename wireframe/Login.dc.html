<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>0 학번 로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
a{text-decoration:none}
input:focus{outline:3px solid #0b5cad;outline-offset:1px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#f5f5f3;color:#222;display:flex;flex-direction:column">
  <div style="padding:72px 28px 32px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
    <div style="width:72px;height:72px;border:2px dashed #555;display:flex;align-items:center;justify-content:center;font-size:12px;color:#444">로고</div>
    <strong style="font-size:30px">수덕자리</strong>
    <span style="font-size:15px;color:#444">수덕전 2층 점심 좌석 현황과 예약</span>
  </div>
  <div style="padding:0 28px;display:flex;flex-direction:column;gap:18px;flex-grow:1">
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="sid" style="font-size:14px;font-weight:700">학번</label>
      <div style="display:flex;align-items:center;gap:10px;border:2px solid #222;background:#fff;padding:0 10px 0 14px;min-height:52px">
        <input id="sid" type="text" inputmode="numeric" maxlength="8" placeholder="학번 8자리" value="{{sid}}" onChange="{{onSid}}" style="flex-grow:1;min-width:0;border:0;font-size:17px;padding:12px 0;background:transparent;color:#222;letter-spacing:.05em">
        <span role="img" aria-label="{{checkLabel}}" style="{{checkStyle}}">
          <sc-if value="{{valid}}" hint-placeholder-val="{{true}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </sc-if>
        </span>
      </div>
      <span style="font-size:13px;color:#444">{{help}}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="pw" style="font-size:14px;font-weight:700">비밀번호</label>
      <input id="pw" type="password" placeholder="학교 포털 비밀번호" value="password" style="border:2px solid #222;background:#fff;min-height:52px;padding:0 14px;font-size:17px;color:#222;box-sizing:border-box">
      <button type="button" onClick="{{toggleSave}}" aria-pressed="{{savePressed}}" style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0;border:0;background:transparent;font:inherit;font-size:15px;color:#222;cursor:pointer;text-align:left">
        <span style="{{saveBox}}">
          <sc-if value="{{save}}" hint-placeholder-val="{{true}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </sc-if>
        </span>
        비밀번호 저장 (다음부터 자동 입력)
      </button>
    </div>
    <a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;background:#222;color:#fff;font-size:17px;font-weight:700;margin-top:6px">로그인</a>
    <span style="font-size:13px;color:#444;text-align:center">동의대학교 재학생만 이용할 수 있습니다.</span>
  </div>
  <div style="padding:20px 28px 32px;font-size:12px;color:#444;text-align:center">로그인 정보는 예약자 확인과 노쇼 관리에만 사용합니다.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sid: '20231234', save: true };
  }
  renderVals() {
    const sid = this.state.sid;
    const valid = /^\d{8}$/.test(sid);
    const box = 'flex:0 0 auto;width:28px;height:28px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;';
    return {
      sid,
      valid,
      checkStyle: box + (valid ? 'background:#1f6f3a;border:2px solid #1f6f3a;' : 'background:#fff;border:2px solid #222;'),
      checkLabel: valid ? '올바른 학번' : '학번 확인 전',
      help: valid ? '올바른 학번 형식입니다.' : (sid.length ? '학번은 숫자 8자리입니다.' : '학번 8자리를 입력하세요.'),
      save: this.state.save,
      savePressed: this.state.save ? 'true' : 'false',
      saveBox: 'flex:0 0 auto;width:24px;height:24px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border:2px solid #222;background:' + (this.state.save ? '#222' : '#fff') + ';',
      toggleSave: () => this.setState({ save: !this.state.save }),
      onSid: (e) => this.setState({ sid: e.target.value.replace(/\D/g, '').slice(0, 8) })
    };
  }
}
</script>
</body>
</html>
